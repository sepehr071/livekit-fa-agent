# LiveKit wss (origin :443) + static DPI-bypass test client.
# lk.example.com (DNS-only) -> origin YOUR_SERVER_IP. Deploy to /etc/nginx/sites-available/.
# Unique map var ($lk_connection_upgrade) so it can't collide with existing WS apps' maps.
map $http_upgrade $lk_connection_upgrade { default upgrade; "" close; }

server {
    listen 443 ssl http2;
    server_name lk.example.com;

    ssl_certificate     /etc/letsencrypt/live/lk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Static test client over HTTPS (secure context required for mic). https://lk.example.com/test/
    location /test/ {
        alias /var/www/lk-client/;
        index index.html;
    }

    # LiveKit signaling (wss) -> local SFU on 7880. Media (UDP 7882 / TCP 7881) bypasses nginx.
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lk_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
