# wss signaling for LiveKit on origin :443 (single public IP, YOUR_SERVER_IP).
# Terminates TLS, reverse-proxies to livekit-server's plain :7880.
# /etc/nginx/sites-available/livekit.conf  ->  symlink into sites-enabled  ->  reload.
#
# Prereqs:
#   - lk.example.com  A -> YOUR_SERVER_IP   (DNS-only / NOT CDN-proxied; WebRTC needs origin)
#   - certbot cert:  sudo certbot certonly --nginx -d lk.example.com
#   - cloud firewall: open inbound TCP 443
#
# NOTE: this vhost handles wss only. The WebRTC *media* (UDP 7882 / TCP 7881) does NOT
# pass through nginx -- it hits the SFU directly on the public IP.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    http2 on;
    server_name lk.example.com;

    ssl_certificate     /etc/letsencrypt/live/lk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ---- Phase-2 hardening: TURN-TLS on :443 (strongest HTTPS disguise) ----
# Single IP can't share :443 between wss (terminate) and TURN-TLS (passthrough).
# Cleanest path = a SECOND public IP for turn.example.com:443.
# Single-IP alternative = nginx `stream{}` + `ssl_preread` SNI demux:
#     turn.example.com -> livekit TURN-TLS (raw TLS passthrough)
#     lk.example.com   -> this https server (move it to 127.0.0.1:8443)
# Documented but fiddlier; defer until UDP+ICE/TCP prove insufficient in the field.
